<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f1f1f1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        h1 {
            color: #ffa500;
        }
        .menu-item {
            display: block;
            margin: 15px 0;
            padding: 10px;
            background-color: #444;
            border-radius: 4px;
            text-decoration: none;
            color: #f1f1f1;
            font-size: 1.2em;
        }
        .menu-item:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Menu</h1>
        <a href="{{ url_for('order_pizza', item='pizza') }}" class="menu-item">Order Pizza</a>
        <a href="{{ url_for('order_sandwich', item='sandwich') }}" class="menu-item">Order Sandwich</a>
        <!-- Add more items as needed -->
    </div>
</body>
</html>
